name: starter-vault

on:
  push:
    paths:
      - "vault/**"
      - "scripts/**"
      - ".github/workflows/starter-vault.yml"
      - "NOTICE.md"
  pull_request:
    paths:
      - "vault/**"
      - "scripts/**"
      - ".github/workflows/starter-vault.yml"
      - "NOTICE.md"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.22"

      - name: Validate starter vaults
        run: python3 scripts/check_starter_vaults.py

      - name: Parse sample tomb text
        run: bun scripts/check_sample_tomb_parse.ts
